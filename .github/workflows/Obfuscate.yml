name: Build Obfuscate BPB Panel

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install javascript-obfuscator terser

      - name: Clone BPB workjs
        run: |
          curl -o origin.js https://raw.githubusercontent.com/bia-pain-bache/BPB-Worker-Panel/refs/heads/main/build/unobfuscated-worker.js
          if [ ! -f origin.js ]; then echo "Failed to download origin.js"; exit 1; fi

      - name: Minify the script
        run: |
          if [ ! -f origin.js ]; then echo "origin.js not found"; exit 1; fi
          npx terser origin.js -o minified.js --compress --mangle

      - name: Obfuscate BPB worker js
        run: |
          if [ ! -f minified.js ]; then echo "minified.js not found"; exit 1; fi
          npx javascript-obfuscator minified.js --output _worker.js \
          --compact true \
          --control-flow-flattening true \
          --control-flow-flattening-threshold 0.5 \
          --dead-code-injection false \
          --identifier-names-generator hexadecimal \
          --rename-globals true \
          --string-array true \
          --string-array-encoding 'base64' \
          --string-array-threshold 0.75 \
          --transform-object-keys true \
          --unicode-escape-sequence false

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: ':arrow_up: update latest bpb panel'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          push_options: '--set-upstream'
          skip_ci: false
